<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hand Ninja</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; background: #0f1116; color: #fff; font: 16px/1.3 system-ui, sans-serif; overflow: hidden; }
  #start { position: fixed; inset: 0; z-index: 10; background: #0f1116; display: grid; place-items: center; text-align: center; padding: 24px; }
  #start h1 { font-size: 30px; margin: 0 0 6px; } #start p { color: #9aa4b8; margin: 0 0 22px; max-width: 420px; }
  .big { display: block; width: min(90vw, 380px); margin: 10px auto; padding: 18px 20px; font: inherit; font-size: 20px; font-weight: 700; border: 0; border-radius: 999px; background: #78ff78; color: #000; }
  .big.pc { background: #2a3145; color: #fff; }
  #phone, #screen { position: fixed; inset: 0; }
  video, #ov { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; transform: scaleX(-1); background: #000; }
  #ov { background: none; pointer-events: none; }
  #gl { width: 100%; height: 100%; display: block; }
  .hud { position: absolute; left: 12px; right: 12px; pointer-events: none; text-shadow: 0 0 6px #000, 0 0 2px #000; font-weight: 700; }
  #ptop { top: 10px; font-size: 14px; color: #c8dcff; white-space: pre-line; } #pbot { bottom: 12px; color: #78ff78; }
  #stop { top: 10px; } #sbot { bottom: 12px; font-size: 14px; color: #9aa4b8; }
  #score { font-size: 42px; color: #ffe678; } #combo { font-size: 20px; color: #78ff78; } #meta { font-size: 14px; color: #c8dcff; }
  #status { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 20px; background: #0f1116; font-size: 18px; white-space: pre-line; }
  #linkBtn { position: absolute; right: 12px; bottom: 12px; padding: 12px 22px; font: inherit; font-weight: 700; border: 0; border-radius: 999px; background: #2a3145; color: #fff; }
  #pair { position: absolute; inset: 0; z-index: 6; display: grid; place-items: center; text-align: center; background: rgba(15,17,22,.92); }
  #pair .code { font-size: 72px; font-weight: 800; letter-spacing: 6px; margin: 8px 0; } #pair p { color: #9aa4b8; max-width: 440px; margin: 6px auto; }
  #qr { display: inline-block; background: #fff; padding: 12px; border-radius: 12px; margin: 10px 0; }
</style>
</head>
<body>
<div id="start" hidden>
  <div>
    <h1>🍉 Hand Ninja</h1>
    <p>Your hands are the blades. What is this device?</p>
    <button class="big" id="pickPhone">📱 PHONE - track my hands</button>
    <button class="big pc" id="pickScreen">🖥 SCREEN - show the fruit (gives a code + QR)</button>
  </div>
</div>
<div id="phone" hidden>
  <video id="cam" autoplay muted playsinline></video>
  <canvas id="ov"></canvas>
  <div class="hud" id="ptop">tracker: loading</div>
  <div class="hud" id="pbot">offline</div>
  <div id="status">Starting the camera…</div>
  <button id="linkBtn">PC LINK</button>
</div>
<div id="screen" hidden>
  <canvas id="gl"></canvas>
  <div class="hud" id="stop"><div id="score">0</div><div id="combo"></div><div id="meta"></div></div>
  <div class="hud" id="sbot">waiting…</div>
  <div id="pair" hidden><div><p>Scan with the phone, or on the phone tap PHONE → PC LINK and enter</p><div class="code" id="pairCode">---</div><div id="qr"></div><p id="pairUrl"></p></div></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js" } }</script>
<script type="module">
import { createNet } from "./net.mjs";
const $ = id => document.getElementById(id), Q = new URLSearchParams(location.search);
const BUILD = 1;
const HFOV = (+Q.get("fov") || 60) * Math.PI / 180;

async function phoneMain() {
  $("phone").hidden = false;
  const { startTracker } = await import("./tracker.mjs");
  const net = createNet({ status: t => $("pbot").textContent = t });
  net.start();
  let pending = Q.get("pair");
  $("linkBtn").onclick = () => { let last = ""; try { last = localStorage.getItem("rpsh_last_screen") || ""; } catch {} const c = prompt("Enter the 3-digit code shown on the SCREEN:", last); if (c && /^\d{3,6}$/.test(c.trim())) net.linkScreen(c.trim()); };
  if (pending) net.linkScreen(pending);
  const video = $("cam"); let src = video;
  const img = Q.get("img"), vid = Q.get("video");
  try {
    if (img) { const im = new Image(); im.src = img; await im.decode(); im.style.cssText = "position:absolute;inset:0;width:100%;height:100%;object-fit:contain;transform:scaleX(-1)"; video.replaceWith(im); src = im; }
    else if (vid) { video.src = vid; video.loop = true; video.muted = true; await video.play(); }
    else { video.srcObject = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user", width: { ideal: 640 }, height: { ideal: 480 }, frameRate: { ideal: 60 } }, audio: false }); await new Promise(r => video.onloadedmetadata = r); }
  } catch (e) { $("status").textContent = "No camera (" + e.message + ").\nThis page is for the phone that tracks the hands."; return; }
  $("status").textContent = "Loading the hand tracker…";
  const rec = Q.get("record") === "1" ? (window.__packets = []) : null;   // ?record=1: keep every packet (test fixtures)
  await startTracker({ video: src, hfov: HFOV, overlay: $("ov"), onHands: pkt => { net.sendHands(pkt); rec?.push(pkt); }, onStats: t => $("ptop").textContent = t + " | build " + BUILD });
  $("status").remove();
}

async function screenMain() {
  $("screen").hidden = false;
  const { createGame } = await import("./game.mjs");
  const game = createGame({ canvas: $("gl"), hfov: HFOV, onHud: s => {
    $("score").textContent = s.score; $("combo").textContent = s.combo >= 3 ? `COMBO x${s.combo}` : "";
    $("meta").textContent = `sliced ${s.sliced} · crushed ${s.crushed} · burst ${s.poked} · missed ${s.missed}` + (s.speed ? ` · last hit ${s.speed.toFixed(1)} m/s` : "");
  } });
  window.ninja = game;
  const showPair = sc => { $("pair").hidden = false; $("pairCode").textContent = sc; const url = location.origin + location.pathname + "?pair=" + sc; $("pairUrl").textContent = url; $("qr").innerHTML = ""; try { new QRCode($("qr"), { text: url, width: 200, height: 200 }); } catch {} };
  const net = createNet({ status: t => $("sbot").textContent = t + " | build " + BUILD, hands: pkt => game.feed(pkt), screenReady: showPair, linked: () => { $("pair").hidden = true; }, unlinked: sc => showPair(sc) });
  net.becomeScreen();
}

if (Q.get("screen") != null) screenMain().catch(e => { $("sbot").textContent = "Error: " + e.message; console.error(e); });
else if (Q.get("pair") || Q.get("img") || Q.get("video") || Q.get("role") === "phone") phoneMain().catch(e => { const s = $("status"); if (s) s.textContent = "Error: " + e.message; console.error(e); });
else { $("start").hidden = false; $("pickPhone").onclick = () => location.search = "?role=phone"; $("pickScreen").onclick = () => location.search = "?screen"; }
</script>
</body>
</html>
