<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Doll rig check</title>
<style>
  html,body{margin:0;height:100%;background:#161a1f;color:#dfe8f0;font:13px system-ui,sans-serif;overflow:hidden}
  canvas{display:block}
  #hud{position:fixed;left:10px;top:10px;background:#0d1218cc;padding:8px 10px;border-radius:8px;white-space:pre;line-height:1.5}
  #err{position:fixed;left:10px;bottom:10px;color:#ff9a9a;max-width:70vw}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js"}}</script>
</head>
<body>
<div id="hud">loading…</div>
<div id="err"></div>
<script type="module">
import * as THREE from "three";
import { DollRig, HEAD_LAYER } from "./DollRig.js";

const Q = new URLSearchParams(location.search);
const POSE = Q.get("pose") || "rest";
const VIEW = Q.get("view") || "front";

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(2, devicePixelRatio));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x2a3138);
const camera = new THREE.PerspectiveCamera(35, innerWidth / innerHeight, 0.05, 50);
camera.layers.enable(HEAD_LAYER);
scene.add(new THREE.HemisphereLight(0xffffff, 0x404a55, 2.0));
const sun = new THREE.DirectionalLight(0xfff3e6, 2.2); sun.position.set(2, 4, 3); scene.add(sun);
const grid = new THREE.GridHelper(4, 16, 0x55606c, 0x39424c); scene.add(grid);

const doll = new DollRig(scene);
window.doll = doll; window.THREE = THREE;
const hud = document.getElementById("hud");
addEventListener("error", e => { document.getElementById("err").textContent = e.message; });

const VIEWS = {
  front: [0, 0.95, 3.4, 0, 0.95, 0],
  side:  [3.4, 0.95, 0, 0, 0.95, 0],
  top:   [0.001, 4.2, 0, 0, 0.9, 0],
  three: [2.1, 1.3, 2.6, 0, 0.95, 0],
  face:  [0, 1.55, 1.0, 0, 1.5, 0],
  hand:  [0.55, 1.0, 0.7, 0.28, 0.95, 0],
  handclose: [0.46, 0.99, 0.44, 0.27, 0.94, 0.02],   // close enough to see whether the parts stay in their sockets
};

const target = new THREE.Mesh(new THREE.SphereGeometry(0.03, 12, 8), new THREE.MeshBasicMaterial({ color: 0xff5f5f }));
scene.add(target); target.visible = false;

function pose() {
  doll.reset();
  const V = (x, y, z) => new THREE.Vector3(x, y, z);
  if (POSE === "arms") {                       // both arms straight out in front
    for (const S of "LR") doll.reach(`${S}UpperArm`, `${S}Forearm`, `${S}Hand`,
      V(S === "L" ? -0.22 : 0.22, 1.35, -0.45), V(S === "L" ? -0.45 : 0.45, 1.0, -0.1));
  } else if (POSE === "ik") {                  // one hand to a marked point
    const t = V(+Q.get("tx") || 0.3, +Q.get("ty") || 1.5, +Q.get("tz") || -0.35);
    target.position.copy(t); target.visible = true;
    doll.reach("RUpperArm", "RForearm", "RHand", t, V(0.5, 1.0, 0));
  } else if (POSE === "head") {
    doll.setHead({ yaw: 0.7, pitch: -0.35 });
  } else if (POSE === "fist") {
    // ?bend= degrees on every phalanx, so the angle at which rigid parts start to leave their sockets can be seen
    const deg = +Q.get("bend");
    const base = Number.isFinite(deg) && deg ? [deg, deg, deg * 0.7].map(d => d * Math.PI / 180) : [1.2, 1.4, 0.9];
    for (const S of "LR") for (const f of ["Index", "Middle", "Ring", "Pinky"])
      for (const [j, a] of [[1, base[0]], [2, base[1]], [3, base[2]]]) {
        const n = `${S}${f}${j}`, o = doll.joints[n];
        if (o) { o.rotation.x = -a; o.updateMatrixWorld(true); }
      }
  } else if (POSE === "legs") {
    for (const S of "LR") doll.reach(`${S}Thigh`, `${S}Shin`, `${S}Foot`,
      V(S === "L" ? -0.11 : 0.11, 0.12, S === "L" ? -0.28 : 0.18), V(S === "L" ? -0.3 : 0.3, 0.55, -0.6));
  }
  doll.root.updateMatrixWorld(true);
}

doll.ready.then(() => {
  pose();
  const v = VIEWS[VIEW] || VIEWS.front;
  camera.position.set(v[0], v[1], v[2]); camera.lookAt(v[3], v[4], v[5]);
  const box = new THREE.Box3().setFromObject(doll.root);
  hud.textContent = [
    `joints ${Object.keys(doll.joints).length}  parts ${doll.parts.length}`,
    `height ${(box.max.y - box.min.y).toFixed(3)} m   depth ${(box.max.z - box.min.z).toFixed(3)} m`,
    `eye ${doll.eye.toArray().map(n => n.toFixed(3)).join(", ")}`,
    `pose ${POSE}  view ${VIEW}`,
  ].join("\n");
  window.dollReady = true;
}).catch(e => { document.getElementById("err").textContent = "load failed: " + e.message; console.error(e); });

renderer.setAnimationLoop(() => renderer.render(scene, camera));
addEventListener("resize", () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
</script>
</body>
</html>
