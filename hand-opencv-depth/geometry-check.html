<!doctype html><title>Hand geometry checks</title><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js"}}</script><button id="run">Run geometry checks</button><pre id="result">Ready</pre><script type="module">
import {shortenThumb} from './short-thumb.mjs?v=8-final';import {buildThenar} from './thenar.mjs?v=8-final';import * as T from 'three';import {DollRig} from '../doll/DollRig.js';import {buildTips,tuckThumb,tipWorld,fitThumb,fitPinch} from './contact.mjs?v=8-final';import {blankAngles,emptyProfile} from './profile.mjs?v=8-final';
run.onclick=async()=>{try{const rig=new DollRig(new T.Scene(),{url:new URL('../doll.glb',location.href).href,report:new URL('../doll-report.json',location.href).href});await rig.ready;tuckThumb(rig);shortenThumb(rig);const tips=buildTips(rig);const updateMound=await buildThenar(rig);const basis=n=>{const k=+n.slice(-1),f=n.slice(0,-1),r=rig.rest,here=r['R'+n].world,z=(k<3?r['R'+f+(k+1)].world.clone().sub(here):here.clone().sub(r['R'+f+(k-1)].world)).normalize(),x=r.RIndex1.world.clone().sub(r.RPinky1.world);x.addScaledVector(z,-x.dot(z)).normalize();return new T.Quaternion().setFromRotationMatrix(new T.Matrix4().makeBasis(x,new T.Vector3().crossVectors(z,x).normalize(),z));};
const desired=blankAngles();desired.Thumb1=[20,25,1];desired.Thumb2=[15,-20,0];desired.Thumb3=[30,-47,-12];for(const n of ['Thumb1','Thumb2','Thumb3']){const q=basis(n);rig.joints['R'+n].quaternion.copy(q).multiply(new T.Quaternion().setFromEuler(new T.Euler(...desired[n].map(x=>x*Math.PI/180),'XYZ'))).multiply(q.clone().invert());}rig.root.updateMatrixWorld(true);const targets=[rig.joints.RThumb2.getWorldPosition(new T.Vector3()),rig.joints.RThumb3.getWorldPosition(new T.Vector3()),tipWorld(rig,tips,'R','Thumb')];const initial=structuredClone(desired);initial.Thumb1[0]-=25;initial.Thumb1[1]-=20;initial.Thumb2[0]-=15;const fit=fitThumb(rig,tips,'R',initial,basis,emptyProfile().limits.R,targets);if(fit.gap>=fit.initial*.4)throw Error('Thumb fit did not improve enough');if(fit.angles.Thumb3[1]!==-47||fit.angles.Thumb3[2]!==-12)throw Error('Thumb locks changed');const pinch=fitPinch(rig,tips,'R',fit.angles,basis,emptyProfile().limits.R);if(pinch.gap>pinch.initial)throw Error('Pinch worsened');rig.root.updateMatrixWorld(true);updateMound();for(const side of ['R','L']){const mesh=rig.parts.find(m=>m.name===side+'Hand__thumb_palm_mound');if(!mesh||mesh.geometry.attributes.position.array.some(v=>!Number.isFinite(v)))throw Error('Invalid palm mound');const expected=rig.rest[side+'Thumb1'].world.clone().sub(rig.rest[side+'Hand'].world);if(rig.joints[side+'Thumb1'].position.distanceTo(expected)>1e-9)throw Error('Thumb root moved');if(rig.parts.filter(m=>m.name.startsWith(side+'Thumb1__')).some(m=>!m.userData.hiddenThumbBase))throw Error('Third thumb segment exposed');}const contacts={};for(const finger of ['Index','Middle','Ring','Pinky']){const c=fitPinch(rig,tips,'R',fit.angles,basis,emptyProfile().limits.R,finger);if(c.gap>c.initial+1e-8)throw Error(finger+' contact worsened');contacts[finger]={beforeMm:c.initial*1000,afterMm:c.gap*1000};}result.textContent=JSON.stringify({contacts,pass:true,palmMounds:2,tipTargets:Object.keys(tips).length,thumbBeforeMm:fit.initial*1000,thumbAfterMm:fit.gap*1000,pinchBeforeMm:pinch.initial*1000,pinchAfterMm:pinch.gap*1000,thumbTipSide:fit.angles.Thumb3[1]},null,2);}catch(e){result.textContent='FAIL: '+e.message;}};
</script>
