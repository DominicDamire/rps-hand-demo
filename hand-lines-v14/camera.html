<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Phone camera · Hand Pose Lab</title><link rel="stylesheet" href="lab.css?v=2"><script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js"></script><style>body{max-width:600px;margin:auto;padding:20px}video{width:100%;max-height:60vh;background:#05080c;border-radius:12px;margin:18px 0}h1{font-size:24px}</style></head><body><h1>Phone camera for your PC lab</h1><p>Keep both devices on the same Wi-Fi. Your video goes to the paired PC; edit and save poses there.</p><label>Camera<select id="facing"><option value="user">Front camera</option><option value="environment">Back camera</option></select></label><div class="row"><button id="start" class="primary">Start camera</button><button id="stop" disabled>Stop camera</button></div><p id="status" role="status">Tap Start camera and allow camera access.</p><video id="video" autoplay playsinline muted></video><p>Keep this page open while using the lab. Freeze & edit on the PC pauses tracking; Stop camera here ends video sharing.</p><script type="module">
import {sendPhone} from './phone-link.mjs?v=14-camera3';
const $=id=>document.getElementById(id);let stop=null,epoch=0;
function end(){epoch++;stop?.();stop=null;$('start').disabled=false;$('facing').disabled=false;$('stop').disabled=true;}
$('start').onclick=async()=>{const token=++epoch;$('start').disabled=true;$('facing').disabled=true;$('stop').disabled=false;$('status').textContent='Opening camera…';try{const close=await sendPhone(new URLSearchParams(location.search).get('pair')||'',$('video'),t=>$('status').textContent=t,$('facing').value);if(token!==epoch)close();else stop=close;}catch(e){if(token===epoch){end();$('status').textContent=e.message;}}};
$('stop').onclick=()=>{end();$('status').textContent='Camera stopped.';};addEventListener('pagehide',end);
</script></body></html>
