<!doctype html><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js"}}</script><pre id="result">Loading</pre><script type="module">
import * as T from 'three';import {DollRig} from '../doll/DollRig.js';import {buildTips} from './contact.mjs';import {directDriver} from './direct.mjs?v=13';import {DirectionStabilizer} from './stability.mjs?v=13';
const names=['Thumb','Index','Middle','Ring','Pinky'],rad=Math.PI/180;
try {
 const rig=new DollRig(new T.Scene(),{url:new URL('../doll.glb',location).href,report:new URL('../doll-report.json',location).href});await rig.ready;
 const tips=buildTips(rig);let directionError=0,attachmentError=0,geometryError=0,largestNoiseRotation=0;const edgeLengths=new Map();
 for(const side of ['R','L']){
  const run=directDriver(rig,tips),across=rig.rest[side+'Index1'].world.clone().sub(rig.rest[side+'Pinky1'].world);
  for(const view of [0,.7,Math.PI/2])for(const gesture of ['open','middle','fist']){
   const palmQ=new T.Quaternion().setFromEuler(new T.Euler(.2,view,.1));let previous;
   for(const jitter of [-.001,.001]){
    const p=[new T.Vector3(0,0,-.6)],targets=[];
    for(let f=0;f<5;f++){
     const name=side+names[f],rest=rig.rest[name+'2'].world.clone().sub(rig.rest[name+'1'].world).normalize(),hinge=across.clone().addScaledVector(rest,-across.dot(rest)).normalize();
     const curl=gesture==='open'||gesture==='middle'&&f===2?0:90;
     const chain=[rig.rest[name+'1'].world.clone().sub(rig.rest[side+'Hand'].world).applyQuaternion(palmQ).add(p[0])];
     for(let k=0;k<3;k++){const dir=rest.clone().applyAxisAngle(hinge,(curl+(curl?k*55:0))*rad).addScaledVector(hinge,jitter).normalize().applyQuaternion(palmQ);chain.push(chain[k].clone().addScaledVector(dir,.03));targets.push(dir);}p.push(...chain);
    }
    run(p,side,palmQ,1/60,{noiseDegrees:0,lm:p.map(v=>({x:v.x,y:v.y})),width:480,height:480,thickness:1.3,tipInset:2});
    for(let f=0;f<5;f++)for(let k=1;k<=3;k++){
     const name=side+names[f]+k,j=rig.joints[name],rest=k<3?rig.rest[side+names[f]+(k+1)].world.clone().sub(rig.rest[name].world):tips[side+names[f]].clone();
     const actual=rest.normalize().applyQuaternion(j.getWorldQuaternion(new T.Quaternion()));directionError=Math.max(directionError,actual.angleTo(targets[f*3+k-1]));
     if(k<3){const next=rig.joints[side+names[f]+(k+1)],expected=rig.rest[next.name].world.distanceTo(rig.rest[name].world);attachmentError=Math.max(attachmentError,Math.abs(j.getWorldPosition(new T.Vector3()).distanceTo(next.getWorldPosition(new T.Vector3()))-expected));}
     if(previous)largestNoiseRotation=Math.max(largestNoiseRotation,j.getWorldQuaternion(new T.Quaternion()).angleTo(previous[name]));
    }
    previous=Object.fromEntries(names.flatMap(f=>[1,2,3].map(k=>{const n=side+f+k;return[n,rig.joints[n].getWorldQuaternion(new T.Quaternion())];})));
    rig.root.updateMatrixWorld(true);
    for(const mesh of rig.parts.filter(m=>m.name.startsWith(side))){const a=mesh.geometry.attributes.position;if(a.count<2)continue;const length=new T.Vector3().fromBufferAttribute(a,0).applyMatrix4(mesh.matrixWorld).distanceTo(new T.Vector3().fromBufferAttribute(a,Math.floor(a.count/2)).applyMatrix4(mesh.matrixWorld));if(edgeLengths.has(mesh))geometryError=Math.max(geometryError,Math.abs(length-edgeLengths.get(mesh)));else edgeLengths.set(mesh,length);}
   }
  }
 }
 const filter=new DirectionStabilizer(),up=new T.Vector3(0,1,0),axis=new T.Vector3(1,0,0);filter.update('finger',up,1/30,1);let noiseOutput=0;
 for(let i=0;i<100;i++)noiseOutput=Math.max(noiseOutput,filter.update('finger',up.clone().applyAxisAngle(axis,(i%2?1:-1)*.7*rad),1/30,1).angleTo(up));
 const target=up.clone().applyAxisAngle(axis,60*rad);let response;for(let i=0;i<2;i++)response=filter.update('finger',target,1/30,1);const responseError=response.angleTo(target)/rad;
 document.querySelector('pre').textContent=JSON.stringify({pass:directionError/rad<.3&&attachmentError<1e-8&&geometryError<1e-8&&largestNoiseRotation/rad<2&&noiseOutput<1e-8&&responseError<2,directionErrorDegrees:directionError/rad,attachmentError,geometryError,largestNoiseRotationDegrees:largestNoiseRotation/rad,noiseOutputDegrees:noiseOutput/rad,responseErrorAfter67msDegrees:responseError},null,2);
}catch(e){document.querySelector('pre').textContent=e.stack;}
</script>
